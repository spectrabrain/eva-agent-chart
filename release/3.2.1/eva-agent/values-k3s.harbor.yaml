image:
  repository: "{{ harbor_url }}/eva/eva-agent"
  pullPolicy: Always
  tag: "3.2.1"

imagePullSecrets: []

persistence:
  s3Sync:
    image: "{{ harbor_url }}/eva/aws-cli:2.33.8"

nodeSelector:
  node.kubernetes.io/instance-type: k3s
  kubernetes.io/os: linux

sharedPvcStorage:
  nfs:
    server: "localhost"
    path: "{{ eva_agent_nfs_share_path }}/agent-cache"

resources:
  requests:
    # cpu: 100m
    memory: 3Gi

ecrRefresh:
  enabled: false
