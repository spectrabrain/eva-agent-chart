image:
  repository: "211722900905.dkr.ecr.ap-northeast-2.amazonaws.com/spectrabrain/eva-agent"
  pullPolicy: Always
  tag: "3.3.0-rc.2"

ecrRefresh:
  registry: "211722900905.dkr.ecr.ap-northeast-2.amazonaws.com"
  # 외부 registry에 접근할 수 있는 k3s 환경: 보조 이미지는 3.2.1과 같은 Docker Hub 이미지.
  awsCliImage: docker.io/amazon/aws-cli:2.33.8
  kubectlImage: docker.io/bitnami/kubectl:latest

nodeSelector:
  node.kubernetes.io/instance-type: k3s
  kubernetes.io/os: linux

resources:
  requests:
    # cpu: 100m
    memory: 3Gi
