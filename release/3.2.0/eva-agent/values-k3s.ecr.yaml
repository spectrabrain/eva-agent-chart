image:
  repository: "339713051385.dkr.ecr.ap-northeast-2.amazonaws.com/mellerikat/release/eva-agent"
  pullPolicy: Always
  tag: "3.2.0"

persistence:
  s3Sync:
    image: amazon/aws-cli:2.33.8

ecrRefresh:
  awsCliImage: amazon/aws-cli:2.33.8
  kubectlImage: bitnami/kubectl:latest

nodeSelector:
  node.kubernetes.io/instance-type: k3s
  kubernetes.io/os: linux

sharedPvcStorage:
  nfs:
    path: /share/eva-agent/agent-cache

resources:
  requests:
    # cpu: 100m
    memory: 3Gi
